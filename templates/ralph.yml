# Ralph Orchestrator Configuration
# Copy this file to your project root as ralph.yml
#
# See: openspec/changes/add-ralph-mode/design.md (or .opencode/openspec/changes/add-ralph-mode/design.md when scaffolded)

ralph:
  # Core settings
  max_iterations: 50           # Maximum iterations before stopping (1-1000)
  timeout_minutes: 120         # Maximum runtime in minutes (1-1440)
  checkpoint_interval: 10      # Git checkpoint every N iterations
  
  # Completion markers - agent output containing these triggers completion
  completion_markers:
    - "- [x] TASK_COMPLETE"
    - "RALPH_COMPLETE"
  
  # Safety settings
  safety:
    detect_infinite_loop: true      # Abort if N identical consecutive outputs
    max_identical_outputs: 3        # Number of identical outputs to trigger abort
    sleep_between_iterations: 2     # Seconds to sleep between iterations (rate limiting)
  
  # Git checkpointing
  git:
    auto_checkpoint: true           # Enable periodic git commits
    checkpoint_branch: null         # Optional: create separate branch (e.g., "ralph-session-{timestamp}")
  
  # Metrics and observability
  metrics:
    track_tokens: true              # Track token usage if available
    export_json: true               # Export metrics to JSON file
    calculate_mttr_a: true          # Calculate Mean Time-to-Recovery for Agentic Systems
  
  # Human-in-the-Loop (HITL) settings
  hitl:
    enabled: true                   # Enable HITL intervention
    mode: "blocking"                # "blocking" (pause for input) or "advisory" (log only)
    triggers:
      high_risk_operations:         # Operations that trigger HITL
        - "git push"
        - "rm -rf"
        - "curl -X DELETE"
        - "DROP TABLE"
        - "DROP DATABASE"
      confidence_threshold: 0.7     # Trigger if confidence below this (future)
      iteration_milestones:         # Trigger at these iteration counts
        - 10
        - 25
        - 40
  
  # Cross-session context persistence
  session_ledger:
    enabled: true                   # Enable session ledger
    local_path: ".opencode/ralph/sessions.md"      # Local session history (gitignored)
    shared_path: ".opencode/ralph/meta-learnings.md"  # Shared learnings (committed)
    max_local_sessions: 20          # Max sessions before pruning
    context_injection:
      recent_local_sessions: 3      # Inject last N local sessions into prompt
      include_shared_learnings: true  # Include shared meta-learnings in prompt
